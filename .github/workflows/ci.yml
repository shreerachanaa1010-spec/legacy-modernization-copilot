name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Run .NET tests
        run: |
          dotnet test LegacyModernizationCopilot.slnx --configuration Release
          dotnet test backend/src/LegacyModernization.Analyzer.Tests/LegacyModernization.Analyzer.Tests.csproj --configuration Release
          dotnet test backend/tests/LegacyModernization.Api.Tests/LegacyModernization.Api.Tests.csproj --configuration Release

      - name: Run Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt
          python -m pytest python/tests -q

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build