services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5198:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    env_file:
      - ./backend/src/LegacyModernization.Api/.env
    volumes:
      - ./samples:/app/samples
      - ./reports:/app/reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
