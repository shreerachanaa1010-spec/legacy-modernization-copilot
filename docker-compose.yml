version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5198:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RAG_STORE_MODE=sqlite
    env_file:
      - ./.env
    volumes:
      - ./samples:/app/samples
      - ./reports:/app/reports
      - ./.legacy_rag.sqlite3:/data/.legacy_rag.sqlite3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
